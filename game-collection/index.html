<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게임 9000</title>
    <style>
      :root {
        --bg: #0d1020;
        --panel: #171b33;
        --line: #2a3058;
        --fg: #eef0ff;
        --dim: #9aa0c8;
        --accent: #6c8cff;
        --gold: #ffd166;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      header { position: sticky; top: 0; z-index: 5; background: rgba(13,16,32,0.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 16px; }
      .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
      h1 b { color: var(--gold); }
      .stats { color: var(--dim); font-size: 13px; }
      .spacer { flex: 1; }
      input, select, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      #search { width: 220px; max-width: 100%; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
      .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      main { padding: 16px; max-width: 1400px; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .1s, border-color .1s; position: relative; }
      .card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .thumb { height: 92px; display: flex; align-items: center; justify-content: center; font-size: 44px; position: relative; }
      .no { position: absolute; left: 8px; top: 6px; font-size: 11px; font-weight: 700; opacity: .8; }
      .fav { position: absolute; right: 6px; top: 2px; font-size: 18px; background: none; border: none; padding: 2px; color: #fff8; }
      .fav.on { color: var(--gold); }
      .info { padding: 8px 10px 10px; }
      .title { font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 34px; }
      .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 4px; }
      .best { color: var(--gold); }
      .pager { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
      .empty { text-align: center; color: var(--dim); padding: 60px 0; }
      #play { position: fixed; inset: 0; background: #05060d; z-index: 20; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); display: none; flex-direction: column; }
      #play.on { display: flex; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .bar .ttl { font-weight: 700; }
      .bar .sub { color: var(--dim); font-size: 13px; }
      .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
      canvas { max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; border-radius: 8px; touch-action: none; background: #000; }
      .help { color: var(--dim); font-size: 13px; padding: 6px 12px 10px; text-align: center; }
      @media (max-width: 600px) {
        .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        #search { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
